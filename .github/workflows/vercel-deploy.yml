name: Vercel Auto Deploy

on:
  push:
    branches: ["main"]

jobs:
  trigger-vercel-deploy:
    name: Trigger Vercel Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "ERROR: VERCEL_DEPLOY_HOOK secret is not set in repository settings."
            exit 1
          fi
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" -H "Content-Type: application/json" -d '{}'