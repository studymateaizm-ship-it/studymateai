name: Vercel Auto Deploy

on:
  push:
    branches: ["main"]

jobs:
  trigger-vercel-deploy:
    name: Trigger Vercel Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook (embedded)
        run: |
          # NOTE: The deploy hook is embedded here for immediate auto-deploy.
          # Embedding secrets in repo history is not recommended.
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_wrK44zKSQ6EXsvGJnwQqdBR45Zci/7FDeD7dcOo" -H "Content-Type: application/json" -d '{}' 